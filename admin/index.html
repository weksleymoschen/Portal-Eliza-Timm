<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração | EMEF Eliza Timm</title><style>
:root{--blue:#064b9b;--blue2:#073b80;--yellow:#ffc928;--bg:#f4f8fd;--ink:#12304f}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:1080px;margin:auto;padding:0 18px}.top{background:#fff}.bar{height:82px;display:flex;align-items:center;gap:14px}
.logo{width:62px;height:62px;border-radius:50%;object-fit:cover}.brand b{font-size:24px;color:var(--blue)}.brand span{display:block;color:#61758b;font-size:13px;margin-top:3px}
.hero{height:290px;position:relative;background:linear-gradient(90deg,rgba(2,54,121,.92),rgba(2,54,121,.28)),url('escola.png') center 42%/cover no-repeat;color:#fff}
.hero .wrap{height:100%;display:flex;align-items:center}.hero h1{font-size:42px;margin:0 0 10px}.hero p{font-size:19px;max-width:560px;line-height:1.45}
.main{padding:34px 18px 50px}.main h2{text-align:center;color:var(--blue);font-size:32px;margin:0 0 8px}.sub{text-align:center;color:#667b91;margin-bottom:26px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 8px 25px #183d6a18;border:1px solid #e7eef8;min-height:190px;display:flex;flex-direction:column}
.icon{width:54px;height:54px;border-radius:15px;background:#eaf3ff;display:grid;place-items:center;font-size:27px}.card h3{color:var(--blue);margin:14px 0 7px}.card p{color:#667b91;line-height:1.4;flex:1;margin:0 0 14px}.btn{border:0;background:var(--yellow);color:#083b77;font-weight:800;padding:12px 16px;border-radius:11px;cursor:pointer;text-decoration:none;text-align:center}
.empty,.loading{background:#fff;border-radius:18px;padding:28px;text-align:center;box-shadow:0 8px 25px #183d6a12;grid-column:1/-1}.foot{background:var(--blue2);color:#fff;padding:28px;text-align:center}.foot b{color:var(--yellow)}
@media(max-width:720px){.bar{height:70px}.logo{width:50px;height:50px}.brand b{font-size:18px}.hero{height:235px;background-position:center 35%}.hero h1{font-size:31px}.hero p{font-size:16px}.grid{grid-template-columns:1fr}.main h2{font-size:27px}}

body{background:#eef4fb}.login{max-width:430px;margin:70px auto;background:#fff;padding:28px;border-radius:22px;box-shadow:0 14px 40px #12385e20}
input,textarea{width:100%;padding:13px;border:1px solid #cad8e8;border-radius:11px;margin:6px 0 12px;font:inherit}textarea{min-height:80px}
.adminTop{background:#073b80;color:white;padding:18px}.adminTop .wrap{display:flex;justify-content:space-between;align-items:center}.panel{max-width:900px;margin:25px auto;padding:0 18px}
.box{background:white;padding:22px;border-radius:18px;box-shadow:0 8px 25px #183d6a15;margin-bottom:20px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.doc{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid #e3ebf4;border-radius:14px;margin-top:10px}.doc .grow{flex:1}.mini{border:0;border-radius:9px;padding:9px 11px;cursor:pointer;font-weight:700}.danger{background:#ffe5e5;color:#a51d1d}.secondary{background:#e8f1ff;color:#064b9b}.status{font-size:12px;font-weight:bold}.ok{color:#168347}.off{color:#a56b00}
</style></head><body>
<div id="login" class="login"><h2 style="color:#064b9b">🔐 Administração</h2><p>EMEF Eliza Timm</p><input id="pwd" type="password" placeholder="Senha administrativa"><button class="btn" style="width:100%" onclick="enter()">Entrar</button><div id="msg" style="margin-top:12px;color:#b3261e"></div></div>
<div id="app" style="display:none"><div class="adminTop"><div class="wrap"><b>Painel Administrativo — EMEF Eliza Timm</b><button class="mini secondary" onclick="logout()">Sair</button></div></div>
<div class="panel"><div class="box"><h2>Novo documento</h2><input id="title" placeholder="Título: ex. Regimento Escolar"><textarea id="desc" placeholder="Descrição (opcional)"></textarea><input id="file" type="file" accept="application/pdf"><label><input id="pub" type="checkbox" checked style="width:auto"> Publicar para as famílias</label><br><br><button class="btn" onclick="upload()">Publicar documento</button><div id="upmsg" style="margin-top:12px"></div></div>
<div class="box"><h2>Documentos cadastrados</h2><div id="docs">Carregando...</div></div></div></div>
<script>
const BASE='https://jrhpgtjhtpbkfcwzrrbz.supabase.co', KEY='sb_publishable_DSGKzIu03cXLwulnvf8a4g_P1-ptaKF'; let password='';
function enter(){password=document.getElementById('pwd').value; if(!password)return; sessionStorage.setItem('eliza_admin',password); test();}
function logout(){sessionStorage.removeItem('eliza_admin');location.reload()}
async function api(action,opt={}){opt.headers=Object.assign({'x-admin-password':password},opt.headers||{});return fetch(BASE+'/functions/v1/school-portal-admin?action='+action,opt)}
async function test(){const m=document.getElementById('msg');m.textContent='Entrando...';try{let r=await api('list');let j=await r.json();if(!r.ok)throw new Error(j.error||'Senha incorreta');document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';m.textContent='';render(j.documents||[]);}catch(e){m.textContent=e.message}}
async function load(){let r=await api('list');let j=await r.json();if(r.ok)render(j.documents||[])}
function render(a){document.getElementById('docs').innerHTML=a.length?a.map(d=>`<div class="doc"><div class="grow"><b>${esc(d.title)}</b><br><span class="status ${d.is_published?'ok':'off'}">${d.is_published?'PUBLICADO':'OCULTO'}</span></div><button class="mini secondary" onclick="toggle(${d.id},${!d.is_published})">${d.is_published?'Ocultar':'Publicar'}</button><button class="mini danger" onclick="delDoc(${d.id})">Excluir</button></div>`).join(''):'Nenhum documento cadastrado.'}
async function upload(){const t=title.value.trim(),f=file.files[0],m=document.getElementById('upmsg');if(!t||!f){m.textContent='Informe o título e escolha um PDF.';return}m.textContent='Enviando...';const fd=new FormData();fd.append('title',t);fd.append('description',desc.value);fd.append('is_published',pub.checked);fd.append('file',f);let r=await api('upload',{method:'POST',body:fd});let j=await r.json();m.textContent=r.ok?'Documento publicado com sucesso.':(j.error||'Erro ao enviar.');if(r.ok){title.value='';desc.value='';file.value='';load()}}
async function toggle(id,v){let r=await api('update',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,is_published:v})});if(r.ok)load();else alert('Não foi possível alterar.')}
async function delDoc(id){if(!confirm('Excluir este documento?'))return;let r=await api('delete&id='+id,{method:'DELETE'});if(r.ok)load();else alert('Não foi possível excluir.')}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
password=sessionStorage.getItem('eliza_admin')||'';if(password)test();
</script></body></html>
