<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel Administrativo | EMEF Eliza Timm</title><style>body{margin:0;font-family:Arial;background:#eef7fd;color:#07356c}.wrap{max-width:900px;margin:35px auto;padding:18px}.box{background:#fff;border-radius:24px;padding:26px;box-shadow:0 12px 35px #07356c20}h1{margin-top:0}.login,input,textarea,select,button{font:inherit}input,textarea,select{width:100%;padding:13px;border:1px solid #cbdceb;border-radius:12px;margin:7px 0 13px}button{border:0;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer}.primary{background:#087df2;color:white}.danger{background:#ffeded;color:#b00020}.row{display:flex;gap:12px}.row>*{flex:1}.doc{border:1px solid #dceaf5;border-radius:16px;padding:16px;margin:12px 0}.muted{color:#627b92}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}@media(max-width:650px){.row,.top{display:block}.top button{margin-top:8px;width:100%}}</style></head><body><div class="wrap"><div class="box"><div id="login"><h1>Área Administrativa</h1><p>EMEF Eliza Timm</p><input id="pass" type="password" placeholder="Senha administrativa"><button class="primary" onclick="enter()">Entrar</button><p id="msg" class="muted"></p></div><div id="app" hidden><div class="top"><div><h1>Painel de Documentos</h1><p class="muted">Os documentos publicados aparecem automaticamente no Portal da Família.</p></div><button onclick="logout()">Sair</button></div><hr><h2>Adicionar documento</h2><input id="title" placeholder="Título, ex.: Regimento Escolar"><textarea id="desc" placeholder="Descrição curta"></textarea><input id="file" type="file" accept="application/pdf"><select id="pub"><option value="true">Publicado</option><option value="false">Oculto</option></select><button class="primary" onclick="upload()">Enviar PDF</button><p id="status"></p><h2>Documentos cadastrados</h2><div id="list"></div></div></div></div><script>
const API='https://jrhpgtjhtpbkfcwzrrbz.supabase.co/functions/v1/school-portal-admin';let pwd='';async function call(action,opt={}){const r=await fetch(API+'?action='+action,{...opt,headers:{...(opt.headers||{}),'x-admin-password':pwd}});const j=await r.json();if(!r.ok)throw Error(j.error||'Erro');return j}async function enter(){pwd=document.getElementById('pass').value;document.getElementById('msg').textContent='Entrando...';try{await call('list');sessionStorage.setItem('eliza_admin',pwd);document.getElementById('login').hidden=true;document.getElementById('app').hidden=false;load()}catch(e){document.getElementById('msg').textContent=e.message}}function logout(){sessionStorage.removeItem('eliza_admin');location.reload()}async function load(){try{const j=await call('list');const l=document.getElementById('list');l.innerHTML='';(j.documents||[]).forEach(d=>{const x=document.createElement('div');x.className='doc';x.innerHTML='<b></b><p class="muted"></p><div class="row"><button class="primary">'+(d.is_published?'Ocultar':'Publicar')+'</button><button class="danger">Excluir</button></div>';x.querySelector('b').textContent=d.title;x.querySelector('p').textContent=d.description||'';const bs=x.querySelectorAll('button');bs[0].onclick=async()=>{await call('update',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:d.id,is_published:!d.is_published})});load()};bs[1].onclick=async()=>{if(confirm('Excluir este documento?')){await call('delete&id='+d.id,{method:'DELETE'});load()}};l.appendChild(x)})}catch(e){document.getElementById('status').textContent=e.message}}async function upload(){const f=document.getElementById('file').files[0],t=document.getElementById('title').value.trim();if(!f||!t)return alert('Informe o título e escolha um PDF.');const fd=new FormData();fd.append('title',t);fd.append('description',document.getElementById('desc').value);fd.append('is_published',document.getElementById('pub').value);fd.append('file',f);document.getElementById('status').textContent='Enviando...';try{await call('upload',{method:'POST',body:fd});document.getElementById('status').textContent='Documento enviado com sucesso.';document.getElementById('title').value='';document.getElementById('desc').value='';document.getElementById('file').value='';load()}catch(e){document.getElementById('status').textContent=e.message}}pwd=sessionStorage.getItem('eliza_admin')||'';if(pwd){call('list').then(()=>{document.getElementById('login').hidden=true;document.getElementById('app').hidden=false;load()}).catch(()=>sessionStorage.removeItem('eliza_admin'))}
</script></body></html>
