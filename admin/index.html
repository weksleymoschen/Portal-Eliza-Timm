<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração | EMEF Eliza Timm</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#eef7fc,#f8fbfd);color:#123c66}.wrap{max-width:900px;margin:auto;padding:28px}.box{background:#fff;padding:28px;border-radius:24px;box-shadow:0 14px 45px #123c6620;border:1px solid #e1edf5}.logo{width:105px;display:block;margin:auto}.center{text-align:center}h2{font-size:30px;margin-bottom:4px}input,textarea,select,button{box-sizing:border-box;width:100%;padding:14px;margin:7px 0;border:1px solid #cbdde9;border-radius:12px;font:inherit}input:focus,textarea:focus,select:focus{outline:2px solid #61aee5;border-color:transparent}button{background:linear-gradient(135deg,#0878c9,#119bc0);color:#fff;border:0;font-weight:800;cursor:pointer}.secondary{background:#617b91}.danger{background:#d74b4b}.hide{display:none}.item{border:1px solid #dce9f1;padding:16px;border-radius:15px;margin:11px 0;background:#f9fcfe}.actions{display:flex;gap:8px;margin-top:9px}.note{font-size:13px;color:#607988}.ok{color:#087b4c}.err{color:#b33}.toplinks{display:flex;gap:10px;margin:16px 0}.toplinks a{flex:1;text-align:center;padding:13px;border-radius:12px;background:#e7f4fc;color:#0874b7;text-decoration:none;font-weight:bold}h3{margin-top:26px;border-bottom:1px solid #e4eef4;padding-bottom:10px}@media(max-width:600px){.wrap{padding:12px}.box{padding:18px}.actions,.toplinks{flex-direction:column}}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;background:#e9f7ef;color:#087b4c}.badge.off{background:#f3f3f3;color:#667}.toplinks{display:none!important}
</style></head><body><div class="wrap"><div class="box"><img src="../logo.jpeg" class="logo"><h2 class="center">Painel Administrativo</h2><p class="center">EMEF Eliza Timm</p>
<section id="login"><p>Digite a senha administrativa.</p><input id="password" type="password" placeholder="Senha"><button id="enter">Entrar</button><p id="loginmsg" class="note"></p></section>
<section id="panel" class="hide"><button class="secondary" id="logout">Sair</button><h3>Adicionar documento</h3><input id="title" placeholder="Nome do item (ex.: Regimento Escolar)"><textarea id="desc" placeholder="Descrição curta (opcional)"></textarea><select id="published"><option value="true">Publicado para as famílias</option><option value="false">Oculto</option></select><input id="file" type="file" accept="application/pdf"><button id="upload">Anexar PDF e salvar</button><p class="note">O documento fica salvo online. Se estiver publicado, aparecerá automaticamente no Portal da Família.</p><p id="msg"></p><h3>Documentos cadastrados</h3><div id="list"></div></section></div></div>
<script>
const API='https://jrhpgtjhtpbkfcwzrrbz.supabase.co/functions/v1/school-portal-admin'; let password=sessionStorage.getItem('eliza_admin_password')||'';
const $=id=>document.getElementById(id);
function req(action,opt={}){opt.headers=Object.assign({'x-admin-password':password},opt.headers||{});return fetch(API+'?action='+action,opt)}
async function enter(){
 password=$('password').value||password;$('loginmsg').textContent='Verificando...';
 try{const r=await req('list');const j=await r.json();if(!r.ok)throw new Error(j.error||'Senha incorreta.');sessionStorage.setItem('eliza_admin_password',password);$('login').classList.add('hide');$('panel').classList.remove('hide');$('loginmsg').textContent='';render(j.documents||[]);}catch(e){$('loginmsg').textContent=e.message}
}
$('enter').onclick=enter;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')enter()});
$('logout').onclick=()=>{sessionStorage.removeItem('eliza_admin_password');location.reload()};
async function load(){const r=await req('list');const j=await r.json();if(r.ok)render(j.documents||[])}
$('upload').onclick=async()=>{const f=$('file').files[0],t=$('title').value.trim(),m=$('msg');if(!t||!f){m.className='err';m.textContent='Informe o nome e escolha um PDF.';return}if(f.type!=='application/pdf'){m.className='err';m.textContent='Escolha um arquivo PDF.';return}m.className='note';m.textContent='Enviando documento...';const fd=new FormData();fd.append('title',t);fd.append('description',$('desc').value.trim());fd.append('is_published',$('published').value);fd.append('file',f);try{const r=await req('upload',{method:'POST',body:fd});const j=await r.json();if(!r.ok)throw new Error(j.error||'Erro ao enviar.');m.className='ok';m.textContent='Documento salvo. Se publicado, já está disponível para as famílias.';$('title').value='';$('desc').value='';$('file').value='';await load();}catch(e){m.className='err';m.textContent=e.message}};
function render(d){$('list').innerHTML=d.length?d.map(x=>`<div class="item"><b>${esc(x.title)}</b><br><span class="badge ${x.is_published?'':'off'}">${x.is_published?'PUBLICADO':'OCULTO'}</span><div class="actions"><button onclick="toggleDoc(${x.id},${!x.is_published})">${x.is_published?'Ocultar':'Publicar'}</button><button class="danger" onclick="delDoc(${x.id})">Excluir</button></div></div>`).join(''):'<p class="note">Nenhum documento cadastrado ainda.</p>'}
window.toggleDoc=async(id,v)=>{const r=await req('update',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,is_published:v})});if(r.ok)load();else alert('Não foi possível alterar o documento.')};
window.delDoc=async id=>{if(!confirm('Excluir este documento?'))return;const r=await req('delete&id='+id,{method:'DELETE'});if(r.ok)load();else alert('Não foi possível excluir o documento.')};
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
if(password)enter();
</script></body></html>
