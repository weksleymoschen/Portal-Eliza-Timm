<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração | EMEF Eliza Timm</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f8fb;color:#123c66}.wrap{max-width:980px;margin:auto;padding:24px}.box{background:#fff;padding:28px;border-radius:22px;box-shadow:0 10px 35px #123c6618;border:1px solid #dce9f1}.logo{width:90px;display:block;margin:auto}.center{text-align:center}input,textarea,select,button{width:100%;padding:13px;margin:6px 0;border:1px solid #cbdde9;border-radius:11px;font:inherit}button{background:#174d78;color:#fff;border:0;font-weight:800;cursor:pointer}.secondary{background:#617b91}.danger{background:#c94848}.hide{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{border:1px solid #dce9f1;padding:16px;border-radius:14px;margin:10px 0;background:#fbfdff}.actions{display:flex;gap:8px}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#e9f7ef;color:#087b4c;font-size:12px;font-weight:800}.badge.off{background:#eee;color:#667}.note{font-size:13px;color:#607988}.ok{color:#087b4c}.err{color:#b33}.files{padding:10px;background:#f4f8fb;border-radius:10px;margin:8px 0}@media(max-width:650px){.wrap{padding:10px}.box{padding:16px}.grid,.actions{display:block}.actions button{margin-top:6px}}</style></head><body><div class="wrap"><div class="box"><img src="../logo.jpeg" class="logo"><h1 class="center">Painel Administrativo</h1><p class="center">EMEF Eliza Timm</p><section id="login"><input id="password" type="password" placeholder="Senha administrativa"><button id="enter">Entrar</button><p id="loginmsg" class="note"></p></section><section id="panel" class="hide"><button class="secondary" id="logout">Sair</button><h2>Nova publicação</h2><div class="grid"><input id="title" placeholder="Título da publicação"><select id="area"><option value="comunicados">Comunicados</option><option value="calendario">Calendário</option><option value="documentos">Documentos</option><option value="galeria">Galeria</option><option value="escola">A Escola</option></select></div><textarea id="content" rows="5" placeholder="Texto/descrição"></textarea><div class="grid"><input id="date" type="date"><select id="published"><option value="true">Publicado para as famílias</option><option value="false">Salvar oculto</option></select></div><label><b>Imagem e anexos</b></label><input id="files" type="file" multiple accept="image/jpeg,image/png,image/webp,application/pdf,.doc,.docx,.xls,.xlsx"><div id="chosen" class="files note">Nenhum arquivo selecionado.</div><button id="upload">Publicar</button><p class="note">Você pode selecionar várias imagens, PDFs, Word e Excel. Máximo de 15 MB por arquivo. A primeira imagem será usada como capa.</p><p id="msg"></p><h2>Publicações cadastradas</h2><div id="list"></div></section></div></div><script>const API='https://gcnxxczvissktfovmssl.supabase.co/functions/v1/portal-admin';let token=sessionStorage.getItem('eliza_token')||'';const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function req(a,o={}){o.headers=Object.assign(token?{Authorization:'Bearer '+token}:{},o.headers||{});return fetch(API+'?action='+a,o)}async function login(){let r=await fetch(API+'?action=login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})}),j=await r.json();if(!r.ok){$('loginmsg').textContent=j.error||'Não foi possível entrar.';return}token=j.token;sessionStorage.setItem('eliza_token',token);show();load()}function show(){$('login').classList.add('hide');$('panel').classList.remove('hide')}async function load(){let r=await req('list'),j=await r.json();if(!r.ok){sessionStorage.removeItem('eliza_token');location.reload();return}render(j.publicacoes||[])}function render(d){$('list').innerHTML=d.length?d.map(x=>`<div class="item"><b>${esc(x.titulo)}</b> <span class="badge ${x.publicado?'':'off'}">${x.publicado?'PUBLICADO':'OCULTO'}</span><div class="note">${esc(x.area)} • ${(x.anexos||[]).length} anexo(s)</div><div class="actions"><button onclick="toggle(${x.id},${!x.publicado})">${x.publicado?'Ocultar':'Publicar'}</button><button class="danger" onclick="del(${x.id})">Excluir</button></div></div>`).join(''):'<p class="note">Nenhuma publicação cadastrada nesta nova base.</p>'}window.toggle=async(id,v)=>{await req('update',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,publicado:v})});load()};window.del=async id=>{if(confirm('Excluir esta publicação e seus anexos?')){await req('delete&id='+id,{method:'DELETE'});load()}};$('files').onchange=()=>{$('chosen').innerHTML=[...$('files').files].map(f=>'• '+esc(f.name)).join('<br>')||'Nenhum arquivo selecionado.'};$('upload').onclick=async()=>{let m=$('msg'),title=$('title').value.trim();if(!title){m.className='err';m.textContent='Informe o título.';return}let fd=new FormData();fd.append('titulo',title);fd.append('conteudo',$('content').value);fd.append('area',$('area').value);fd.append('data_evento',$('date').value);fd.append('publicado',$('published').value);for(const f of $('files').files)fd.append('files',f);m.className='note';m.textContent='Enviando...';let r=await req('upload',{method:'POST',body:fd}),j=await r.json();if(!r.ok){m.className='err';m.textContent=j.error||'Erro ao publicar.';return}m.className='ok';m.textContent='Publicação salva com sucesso.';$('title').value='';$('content').value='';$('date').value='';$('files').value='';$('chosen').textContent='Nenhum arquivo selecionado.';load()};$('enter').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};$('logout').onclick=async()=>{await req('logout',{method:'POST'});sessionStorage.removeItem('eliza_token');location.reload()};if(token){show();load()}</script></body></html>
