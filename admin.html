<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | EMEF Eliza Timm</title><style>body{margin:0;font-family:Arial;background:#eef6fa;color:#17394b}.wrap{max-width:780px;margin:auto;padding:22px}.box{background:#fff;padding:22px;border-radius:20px;box-shadow:0 8px 28px #1232}.logo{width:90px;display:block;margin:auto}.center{text-align:center}input,textarea,select,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border:1px solid #cbdce5;border-radius:10px;font:inherit}button{background:#1187ad;color:#fff;border:0;font-weight:bold;cursor:pointer}.secondary{background:#667f8f}.danger{background:#b74646}.hide{display:none}.item{border:1px solid #d9e7ee;padding:14px;border-radius:12px;margin:10px 0}.actions{display:flex;gap:8px}.note{font-size:13px;color:#607988}.ok{color:#087b4c}.err{color:#b33}.toplinks{display:flex;gap:8px;margin-bottom:12px}.toplinks a{flex:1;text-align:center;padding:12px;border-radius:10px;background:#e9f5f9;color:#087fa8;text-decoration:none;font-weight:bold}</style></head><body><div class="wrap"><div class="box"><img src="logo.jpeg" class="logo"><h2 class="center">Painel Administrativo</h2><p class="center">EMEF Eliza Timm</p><section id="login"><p>Digite a senha administrativa.</p><input id="password" type="password" placeholder="Senha"><button id="enter">Entrar</button><p id="loginmsg" class="note"></p></section><section id="panel" class="hide"><div class="toplinks"><a href="index.html">Ver Portal da Família</a><a href="qrcode.html">Ver QR Code</a></div><button class="secondary" id="logout">Sair</button><h3>Adicionar documento</h3><input id="title" placeholder="Nome do item (ex.: Regimento Escolar)"><textarea id="desc" placeholder="Descrição curta (opcional)"></textarea><input id="order" type="number" value="10" min="0" placeholder="Ordem"><select id="published"><option value="true">Publicado</option><option value="false">Oculto</option></select><input id="file" type="file" accept="application/pdf"><button id="upload">Anexar PDF</button><p class="note">VERSÃO TESTE: o PDF fica salvo neste navegador. Serve para testar todo o fluxo antes da publicação definitiva.</p><p id="msg"></p><h3>Documentos cadastrados</h3><div id="list"></div></section></div></div><script>
const PASS='Elizatimm2026'; const K='eliza_docs_v3';
const $=id=>document.getElementById(id); const get=()=>JSON.parse(localStorage.getItem(K)||'[]'); const set=x=>localStorage.setItem(K,JSON.stringify(x));
function openPanel(){ $('login').classList.add('hide');$('panel').classList.remove('hide');render() }
$('enter').onclick=()=>{if($('password').value===PASS){sessionStorage.setItem('eliza_admin','1');$('loginmsg').textContent='';openPanel()}else $('loginmsg').textContent='Senha incorreta.'};
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('enter').click()});
$('logout').onclick=()=>{sessionStorage.removeItem('eliza_admin');location.reload()};
if(sessionStorage.getItem('eliza_admin')==='1')openPanel();
$('upload').onclick=()=>{const f=$('file').files[0],t=$('title').value.trim();if(!t||!f){$('msg').className='err';$('msg').textContent='Informe o nome e escolha um PDF.';return}if(f.type!=='application/pdf'){ $('msg').textContent='Escolha um PDF.';return}if(f.size>3*1024*1024){$('msg').textContent='No teste, use PDF de até 3 MB.';return}const r=new FileReader();r.onload=()=>{let d=get();d.push({id:Date.now(),title:t,description:$('desc').value.trim(),sort_order:+$('order').value||10,published:$('published').value==='true',data:r.result});try{set(d)}catch(e){$('msg').textContent='O navegador ficou sem espaço. Use um PDF menor.';return}$('title').value='';$('desc').value='';$('file').value='';$('msg').className='ok';$('msg').textContent='Documento anexado com sucesso.';render()};r.readAsDataURL(f)};
function render(){let d=get().sort((a,b)=>a.sort_order-b.sort_order);$('list').innerHTML=d.length?d.map(x=>`<div class="item"><b>${esc(x.title)}</b><br><small>${x.published?'🟢 Publicado':'⚪ Oculto'} • ordem ${x.sort_order}</small><div class="actions"><button onclick="toggle(${x.id})">${x.published?'Ocultar':'Publicar'}</button><button class="danger" onclick="delDoc(${x.id})">Excluir</button></div></div>`).join(''):'<p class="note">Nenhum documento cadastrado ainda.</p>'}
window.toggle=id=>{let d=get();let x=d.find(v=>v.id===id);x.published=!x.published;set(d);render()};window.delDoc=id=>{if(confirm('Excluir este documento?')){set(get().filter(x=>x.id!==id));render()}};function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script></body></html>
