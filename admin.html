<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração | EMEF Eliza Timm</title><style>body{margin:0;font-family:Arial;background:#eef7fd;color:#07356c}.wrap{max-width:850px;margin:35px auto;padding:20px}.box{background:#fff;padding:28px;border-radius:24px;box-shadow:0 12px 35px #083b7220}h1{margin-top:0}.row{display:grid;gap:12px;margin:16px 0}input,textarea,select,button{font:inherit;padding:14px;border-radius:12px;border:1px solid #cddfeb}button{border:0;background:#087df2;color:#fff;font-weight:700;cursor:pointer}.danger{background:#e8404d}.muted{background:#e8f2fa;color:#07356c}.item{display:grid;grid-template-columns:1fr auto;gap:12px;padding:15px 0;border-top:1px solid #e5eef5}.actions{display:flex;gap:7px;flex-wrap:wrap}@media(max-width:650px){.item{grid-template-columns:1fr}.wrap{margin:0;padding:12px}.box{padding:20px}}</style></head><body><div class="wrap"><div class="box" id="login"><h1>Área Administrativa</h1><p>Digite a senha administrativa.</p><input id="pass" type="password" placeholder="Senha"><div class="row"><button onclick="enter()">Entrar</button><a href="index.html">Voltar ao Portal</a></div><p id="msg"></p></div><div class="box" id="panel" hidden><h1>Gerenciar documentos</h1><p>Adicione PDFs e escolha se ficarão publicados no Portal da Família.</p><div class="row"><input id="title" placeholder="Nome do documento"><textarea id="desc" placeholder="Descrição breve"></textarea><input id="file" type="file" accept="application/pdf"><select id="pub"><option value="1">Publicado</option><option value="0">Oculto</option></select><button onclick="add()">Adicionar documento</button></div><div id="list"></div><div class="row"><a href="index.html">Abrir Portal da Família</a><a href="qrcode.html">Abrir QR Code</a></div></div></div><script>
const KEY='elizaPortalDocs';function enter(){if(document.getElementById('pass').value==='Elizatimm2026'){sessionStorage.setItem('elizaAdmin','1');show()}else document.getElementById('msg').textContent='Senha incorreta.'}function show(){document.getElementById('login').hidden=true;document.getElementById('panel').hidden=false;render()}if(sessionStorage.getItem('elizaAdmin')==='1')show();function docs(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function save(a){localStorage.setItem(KEY,JSON.stringify(a));render()}function add(){const f=file.files[0];if(!title.value.trim()||!f)return alert('Informe o nome e selecione um PDF.');if(f.type!=='application/pdf')return alert('Selecione um PDF.');const r=new FileReader();r.onload=()=>{const a=docs();a.push({id:Date.now(),title:title.value.trim(),description:desc.value.trim(),published:pub.value==='1',data:r.result});save(a);title.value='';desc.value='';file.value=''};r.readAsDataURL(f)}function toggle(id){const a=docs(),d=a.find(x=>x.id===id);d.published=!d.published;save(a)}function del(id){if(confirm('Excluir este documento?'))save(docs().filter(x=>x.id!==id))}function render(){const l=document.getElementById('list');if(!l)return;l.innerHTML='';docs().forEach(d=>{const e=document.createElement('div');e.className='item';e.innerHTML=`<div><b>${d.title}</b><br><small>${d.published?'Publicado':'Oculto'}</small></div><div class="actions"><button class="muted" onclick="toggle(${d.id})">${d.published?'Ocultar':'Publicar'}</button><button class="danger" onclick="del(${d.id})">Excluir</button></div>`;l.appendChild(e)})}
</script></body></html>
