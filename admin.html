<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | EMEF Eliza Timm</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#eef7fc,#f8fbfd);color:#123c66}.wrap{max-width:900px;margin:auto;padding:28px}.box{background:#fff;padding:28px;border-radius:24px;box-shadow:0 14px 45px #123c6620;border:1px solid #e1edf5}.logo{width:105px;display:block;margin:auto}.center{text-align:center}h2{font-size:30px;margin-bottom:4px}input,textarea,select,button{box-sizing:border-box;width:100%;padding:14px;margin:7px 0;border:1px solid #cbdde9;border-radius:12px;font:inherit}input:focus,textarea:focus,select:focus{outline:2px solid #61aee5;border-color:transparent}button{background:linear-gradient(135deg,#0878c9,#119bc0);color:#fff;border:0;font-weight:800;cursor:pointer}.secondary{background:#617b91}.danger{background:#d74b4b}.hide{display:none}.item{border:1px solid #dce9f1;padding:16px;border-radius:15px;margin:11px 0;background:#f9fcfe}.actions{display:flex;gap:8px;margin-top:9px}.note{font-size:13px;color:#607988}.ok{color:#087b4c}.err{color:#b33}.toplinks{display:flex;gap:10px;margin:16px 0}.toplinks a{flex:1;text-align:center;padding:13px;border-radius:12px;background:#e7f4fc;color:#0874b7;text-decoration:none;font-weight:bold}h3{margin-top:26px;border-bottom:1px solid #e4eef4;padding-bottom:10px}@media(max-width:600px){.wrap{padding:12px}.box{padding:18px}.actions,.toplinks{flex-direction:column}}</style></head><body><div class="wrap"><div class="box"><img src="logo.jpeg" class="logo"><h2 class="center">Painel Administrativo</h2><p class="center">EMEF Eliza Timm</p><section id="login"><p>Digite a senha administrativa.</p><input id="password" type="password" placeholder="Senha"><button id="enter">Entrar</button><p id="loginmsg" class="note"></p></section><section id="panel" class="hide"><div class="toplinks"><a href="index.html">Ver Portal da Família</a><a href="qrcode.html">Ver QR Code</a></div><button class="secondary" id="logout">Sair</button><h3>Adicionar documento</h3><input id="title" placeholder="Nome do item (ex.: Regimento Escolar)"><textarea id="desc" placeholder="Descrição curta (opcional)"></textarea><select id="published"><option value="true">Publicado</option><option value="false">Oculto</option></select><input id="file" type="file" accept="application/pdf"><button id="upload">Anexar PDF</button><p class="note">VERSÃO TESTE: o PDF fica salvo neste navegador. Serve para testar todo o fluxo antes da publicação definitiva.</p><p id="msg"></p><h3>Documentos cadastrados</h3><div id="list"></div></section></div></div><script>
const PASS='Elizatimm2026'; const K='eliza_docs_v3';
const $=id=>document.getElementById(id); const get=()=>JSON.parse(localStorage.getItem(K)||'[]'); const set=x=>localStorage.setItem(K,JSON.stringify(x));
function openPanel(){ $('login').classList.add('hide');$('panel').classList.remove('hide');render() }
$('enter').onclick=()=>{if($('password').value===PASS){sessionStorage.setItem('eliza_admin','1');$('loginmsg').textContent='';openPanel()}else $('loginmsg').textContent='Senha incorreta.'};
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('enter').click()});
$('logout').onclick=()=>{sessionStorage.removeItem('eliza_admin');location.reload()};
if(sessionStorage.getItem('eliza_admin')==='1')openPanel();
$('upload').onclick=()=>{const f=$('file').files[0],t=$('title').value.trim();if(!t||!f){$('msg').className='err';$('msg').textContent='Informe o nome e escolha um PDF.';return}if(f.type!=='application/pdf'){ $('msg').textContent='Escolha um PDF.';return}if(f.size>3*1024*1024){$('msg').textContent='No teste, use PDF de até 3 MB.';return}const r=new FileReader();r.onload=()=>{let d=get();d.push({id:Date.now(),title:t,description:$('desc').value.trim(),sort_order:d.length?Math.max(...d.map(x=>x.sort_order||0))+10:10,published:$('published').value==='true',data:r.result});try{set(d)}catch(e){$('msg').textContent='O navegador ficou sem espaço. Use um PDF menor.';return}$('title').value='';$('desc').value='';$('file').value='';$('msg').className='ok';$('msg').textContent='Documento anexado com sucesso.';render()};r.readAsDataURL(f)};
function render(){let d=get().sort((a,b)=>a.sort_order-b.sort_order);$('list').innerHTML=d.length?d.map(x=>`<div class="item"><b>${esc(x.title)}</b><br><small>${x.published?'🟢 Publicado':'⚪ Oculto'}</small><div class="actions"><button onclick="toggle(${x.id})">${x.published?'Ocultar':'Publicar'}</button><button class="danger" onclick="delDoc(${x.id})">Excluir</button></div></div>`).join(''):'<p class="note">Nenhum documento cadastrado ainda.</p>'}
window.toggle=id=>{let d=get();let x=d.find(v=>v.id===id);x.published=!x.published;set(d);render()};window.delDoc=id=>{if(confirm('Excluir este documento?')){set(get().filter(x=>x.id!==id));render()}};function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script></body></html>
