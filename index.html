<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal da Família | EMEF Eliza Timm</title><style>body{margin:0;font-family:Arial;background:linear-gradient(#32a5c7 0 30px,#f1f7fa 30px);color:#15384b}.wrap{max-width:680px;margin:auto;padding:18px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 10px 30px #1232}.logo{width:125px;display:block;margin:auto}.center{text-align:center}.sub{color:#627b89}.item{display:flex;align-items:center;gap:14px;border:1px solid #d6e5ec;border-radius:15px;padding:16px;margin:12px 0;text-decoration:none;color:#17394b}.ico{font-size:30px}.item b{display:block;font-size:17px}.item small{color:#66808e}.arrow{margin-left:auto;font-size:24px;color:#1192bd}.empty{padding:24px;text-align:center;background:#f6fafc;border-radius:14px;color:#607987}.foot{text-align:center;color:#6c8796;font-size:13px;margin:24px}.admin{text-align:center;margin-top:20px}.admin a{font-size:12px;color:#8aa0ac;text-decoration:none}</style></head><body><div class="wrap"><div class="card"><img src="logo.jpeg" class="logo"><h1 class="center">EMEF Eliza Timm</h1><h2 class="center">Portal da Família</h2><p class="center sub">Documentos e informações importantes da nossa escola.</p><div id="docs"></div><div class="admin"><a href="admin.html">Acesso administrativo</a></div></div><div class="foot">EMEF Eliza Timm • Informação mais perto da família</div></div><script>const K='eliza_docs_v3';let d=JSON.parse(localStorage.getItem(K)||'[]').filter(x=>x.published).sort((a,b)=>a.sort_order-b.sort_order);const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));document.getElementById('docs').innerHTML=d.length?d.map(x=>`<a class="item" href="viewer.html?id=${x.id}"><span class="ico">📄</span><span><b>${esc(x.title)}</b><small>${esc(x.description||'Toque para visualizar')}</small></span><span class="arrow">›</span></a>`).join(''):'<div class="empty">Nenhum documento publicado ainda.<br><small>Use o acesso administrativo para anexar o primeiro PDF.</small></div>';</script></body></html>
