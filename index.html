<main class="wrap"><section class="portal"><div class="top"><div class="familyIcon">👥</div><div><h2>Portal da <span>Família</span></h2><p>Aqui você encontra documentos e informações importantes da nossa escola.</p></div></div><div class="layout"><div class="docs" id="docs"><div class="empty">Carregando informações...</div></div></div></section></main>

<script>
const BASE='https://jrhpgtjhtpbkfcwzrrbz.supabase.co',KEY='sb_publishable_DSGKzIu03cXLwulnvf8a4g_P1-ptaKF',BUCKET='school-portal-documents';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const icons=['📄','📅','🕐','📋','📝','📢','📚','📌'];
const fileUrl=p=>BASE+'/storage/v1/object/public/'+BUCKET+'/'+String(p).split('/').map(encodeURIComponent).join('/');
async function load(){
 const el=document.getElementById('docs');
 try{
  const u=BASE+'/rest/v1/school_portal_documents?school_slug=eq.emef-eliza-timm&is_published=eq.true&select=id,title,description,file_path,created_at&order=created_at.asc';
  const r=await fetch(u,{headers:{apikey:KEY,Authorization:'Bearer '+KEY},cache:'no-store'});
  const d=await r.json(); if(!r.ok) throw new Error(d.message||d.error||'Falha ao carregar');
  el.innerHTML=d.length?d.map((x,i)=>`<a class="doc" href="${fileUrl(x.file_path)}" target="_blank" rel="noopener"><span class="icon">${icons[i%icons.length]}</span><h3>${esc(x.title)}</h3><p>${esc(x.description||'Documento e informações da escola.')}</p><span class="btn">Visualizar →</span></a>`).join(''):'<div class="empty"><b>Nenhum documento publicado no momento.</b><br><small>As informações publicadas pela escola aparecerão aqui automaticamente.</small></div>';
 }catch(e){el.innerHTML='<div class="empty"><b>Não foi possível carregar os documentos.</b><br><small>'+esc(e.message)+'</small></div>';}
}
load();
</script></body></html>
