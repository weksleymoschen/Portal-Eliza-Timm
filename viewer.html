<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Visualizar documento</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#333}.bar{position:fixed;z-index:10;top:0;left:0;right:0;height:58px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#fff;box-shadow:0 2px 8px #0003}.bar a{text-decoration:none;color:#087fa8;font-weight:700;white-space:nowrap}.bar b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#17394b}.pdf{position:fixed;top:58px;left:0;right:0;bottom:0;width:100%;height:calc(100dvh - 58px);border:0;background:#333;display:block}.err{position:fixed;top:58px;left:0;right:0;bottom:0;background:#eef5f8;padding:30px;text-align:center;color:#17394b}</style></head><body><div class="bar"><a href="index.html">← Voltar ao Portal</a><b id="t">Documento</b></div><div id="v"></div><script>const id=+new URLSearchParams(location.search).get('id');const docs=JSON.parse(localStorage.getItem('eliza_docs_v3')||'[]');const d=docs.find(x=>x.id===id&&x.published);if(d){document.getElementById('t').textContent=d.title;const iframe=document.createElement('iframe');iframe.className='pdf';iframe.src=d.data+'#view=FitH&toolbar=1&navpanes=0';iframe.title=d.title;document.getElementById('v').appendChild(iframe)}else document.getElementById('v').innerHTML='<div class="err">Documento não encontrado ou não publicado.</div>';</script></body></html>
