<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;height:100%;font-family:Arial;background:#222}.top{height:58px;background:#073b77;color:#fff;display:flex;align-items:center;padding:0 15px;gap:15px}.top a{color:#fff;text-decoration:none;font-weight:bold}.top b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}iframe{width:100%;height:calc(100vh - 58px);border:0;background:#fff}</style></head><body><div class="top"><a href="index.html">← Voltar</a><b id="name">Documento</b></div><iframe id="pdf"></iframe><script>const id=Number(new URLSearchParams(location.search).get('id'));let a=[];try{a=JSON.parse(localStorage.getItem('elizaPortalDocs')||'[]')}catch{};const d=a.find(x=>x.id===id);if(d){name.textContent=d.title;pdf.src=d.data}else{document.body.innerHTML='<div class="top"><a href="index.html">← Voltar</a></div><div style="color:white;padding:30px">Documento não encontrado neste aparelho.</div>'}</script></body></html>
