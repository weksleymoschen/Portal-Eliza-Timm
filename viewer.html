<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visualizar documento</title><style>html,body{margin:0;height:100%;font-family:Arial;background:#eef5f8}.bar{height:58px;display:flex;align-items:center;gap:12px;padding:0 15px;background:#fff;box-shadow:0 2px 8px #1232}.bar a{text-decoration:none;color:#087fa8;font-weight:bold}.bar b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}iframe{width:100%;height:calc(100% - 58px);border:0}.err{padding:30px;text-align:center}</style></head><body><div class="bar"><a href="index.html">← Voltar</a><b id="t">Documento</b></div><div id="v"></div><script>const id=+new URLSearchParams(location.search).get('id');const d=JSON.parse(localStorage.getItem('eliza_docs_v3')||'[]').find(x=>x.id===id&&x.published);if(d){t.textContent=d.title;v.innerHTML=`<iframe src="${d.data}#toolbar=0&navpanes=0"></iframe>`}else v.innerHTML='<div class="err">Documento não encontrado ou não publicado.</div>';</script></body></html>
