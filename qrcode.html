<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Code | EMEF Eliza Timm</title><style>body{font-family:Arial;background:#eef7fd;color:#07356c;text-align:center;margin:0;padding:30px}.box{max-width:650px;margin:auto;background:#fff;padding:30px;border-radius:24px;box-shadow:0 12px 35px #083b7220}input{width:100%;padding:14px;border:1px solid #cbddea;border-radius:12px;box-sizing:border-box}.qr{margin:25px auto;width:260px;height:260px;background:white;border:14px solid white;border-radius:18px;display:grid;place-items:center}.qr img{max-width:100%}button{padding:13px 20px;border:0;border-radius:12px;background:#087df2;color:white;font-weight:bold}a{display:block;margin-top:20px}</style></head><body><div class="box"><h1>QR Code do Portal</h1><p>Depois de publicar no Netlify, cole abaixo o endereço definitivo do Portal.</p><input id="url" placeholder="https://seu-portal.netlify.app"><button onclick="make()">Gerar QR Code</button><div class="qr" id="q"><span>QR CODE</span></div><p>O QR Code deve apontar para o endereço público do portal.</p><a href="index.html">← Voltar ao Portal</a></div><script>function make(){const v=url.value.trim();if(!v)return alert('Cole o endereço do portal.');q.innerHTML='<img alt="QR Code" src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&data='+encodeURIComponent(v)+'">'}</script></body></html>
