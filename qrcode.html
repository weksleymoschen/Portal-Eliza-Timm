<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Code | EMEF Eliza Timm</title><style>body{font-family:Arial;background:#eef6fa;color:#17394b;text-align:center;margin:0}.box{max-width:520px;margin:30px auto;background:#fff;padding:28px;border-radius:20px}.logo{width:100px}.qr{margin:20px auto;padding:15px;background:white;width:max-content;border:1px solid #ddd}.btn{display:inline-block;padding:12px 18px;background:#1187ad;color:white;text-decoration:none;border-radius:10px;font-weight:bold}</style></head><body><div class="box"><img src="logo.jpeg" class="logo"><h2>QR Code do Portal da Família</h2><p>Depois de publicar o portal, este QR Code apontará para o endereço público da página inicial.</p><div id="q" class="qr"></div><p id="u"></p><a class="btn" href="index.html">Voltar ao portal</a></div><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>const url=new URL('index.html',location.href).href;u.textContent=url;new QRCode(q,{text:url,width:220,height:220});</script></body></html>
